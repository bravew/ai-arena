[project]
name = "ai-arena"
version = "0.1.0"
description = "Local-first workbench for comparing AI models, agents, and kits on coding and content tasks"
readme = "docs/DEV_PLAN.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.25",
    "pydantic>=2.11",
    "PyYAML>=6.0",
    "typer>=0.16",
]

[project.scripts]
arena = "arena.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pyright>=1.1.400",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "-p", "tests.testenv.plugin"]
xfail_strict = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # DEV_PLAN code blocks are sketches, not code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
