    - anthropic/claude-opus-5-5:high
    - openai/gpt-x:medium
    - google/gemini-3-pro:high
    - openrouter/qwen/qwen3-coder
  scaffold:
    - { id: opencode, version: 1.2.0 }
    - { id: pi, version: 0.99.2 }
kit: kits/team-coding@3
