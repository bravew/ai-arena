exclude:
  - { model: anthropic/claude-sonnet-4-5, scaffold: none }
  - { model: anthropic-max/claude-opus-5-5-sub, scaffold: { id: claude-code, version: 2.4.1 } }
  - { model: openai-plus/gpt-6.1-sol, scaffold: { id: claude-code, version: 2.4.1 } }
