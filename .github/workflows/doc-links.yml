name: Documentation links

on:
  pull_request:
    paths:
      - 'docs/subsystems/**'
      - 'docs/DEV_PLAN.md'
      - 'scripts/check_doc_links.py'
      - '.github/workflows/doc-links.yml'
  push:
    paths:
      - 'docs/subsystems/**'
      - 'docs/DEV_PLAN.md'
      - 'scripts/check_doc_links.py'
      - '.github/workflows/doc-links.yml'

jobs:
  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_doc_links.py
