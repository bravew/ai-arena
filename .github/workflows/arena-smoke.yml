name: Arena smoke

on:
  pull_request:
    branches: [main, "epic/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Check committed smoke fixture suite
        run: uv run pytest tests/core/test_smoke_inputs.py
      - name: Render summary
        if: always()
        env:
          ARENA_SMOKE_STATUS: ${{ job.status }}
          ARENA_SMOKE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/post_summary.py
      - name: Comment summary on pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body-file "$GITHUB_STEP_SUMMARY"
